<body>
    {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Good Night Images</title>
    <link rel="stylesheet" href="{% static 'css/good_night.css' %}">
    <style>
        body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    min-height:100vh;
}

.title{
    text-align:center;
    color:white;
    padding:20px;
    font-size:35px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    width:280px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h2{
    color:#333;
    padding:15px;
}

    </style>
</head>
<body>

    <h1 class="title">🌙 Good Night Gallery</h1>

    <div class="container">
        {% for i in good_night_images %}
        <div class="card">
            <img src="{{ i.image.url }}" alt="{{ i.name }}">
            <h2>{{ i.name }}</h2>
        </div>
        {% endfor %}
    </div>

</body>
</html>
</body>
</html>

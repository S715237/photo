<!DOCTYPE html>
<html>
<head>
    <title>Ganesh Chaturthi Gallery</title>
    <style>
        body{
            background-color:#f5f5f5;
            text-align:center;
            font-family:Arial;
        }

        h1{
            color:darkorange;
        }

        .gallery{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .gallery img{
            width:300px;
            height:300px;
            object-fit:cover;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }
    </style>
</head>
<body>

    <h1>Ganesh Chaturthi Images</h1>

    <div class="gallery">
        {% for i in data %}
            <img src="{{ i.image.url }}" alt="Ganesh Image">
        {% endfor %}
    </div>

</body>
</html>

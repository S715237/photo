<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molly Gallery</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#013220;
    color:white;
}

/* Header */
header{
    background:black;
    padding:15px;
    text-align:center;
}

header h1{
    color:#90ee90;
}

/* Gallery */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

/* Card */
.card{
    background:white;
    color:black;
    width:280px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.5);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

/* Image */
.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

/* Content */
.content{
    padding:15px;
    text-align:center;
}

.content h2{
    margin:10px 0;
    color:green;
}

/* Button */
.btn{
    display:inline-block;
    padding:10px 15px;
    background:green;
    color:white;
    text-decoration:none;
    border-radius:5px;
    margin-top:10px;
}

.btn:hover{
    background:darkgreen;
}

/* Mobile Responsive */
@media(max-width:768px){

    .container{
        flex-direction:column;
        align-items:center;
    }

    .card{
        width:90%;
    }

}

</style>
</head>

<body>

<header>
    <h1>🌿 Molly Gallery</h1>
</header>

<div class="container">

    {% for s in data %}

    <div class="card">

        <img src="{{ s.image.url }}" alt="{{ s.name }}">

        <div class="content">
            <h2>{{ s.name }}</h2>

            <a href="#" class="btn">View More</a>
        </div>

    </div>

    {% endfor %}

</div>

</body>
</html>

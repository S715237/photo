<!DOCTYPE html>
{% load static%}
<html lang="en">
<head>
    <title>Photo Gallery</title>
    
    <style>
        body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

/* Header */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
    background:#111;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:24px;
    font-weight:bold;
    color:white;
}

.logo img{
    width:50px;
    height:50px;
    object-fit:cover;
    border-radius:50%; /* Remove if you don't want a circular logo */
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-size:18px;
}

nav a:hover{
    color:#ff9800;
}

/* Hero */
.hero{
    height:250px;
    background:url('https://picsum.photos/1200/300') center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

.search-box{
    display:flex;
}

.search-box input{
    padding:12px;
    width:300px;
    border:none;
}

.search-box button{
    padding:12px 20px;
    border:none;
    background:#1bb3b3;
    color:white;
    cursor:pointer;
}

/* Gallery */
.gallery-section{
    width:90%;
    margin:auto;
    padding:40px 0;
}

.gallery-section h2{
    color:#1bb3b3;
}

.gallery{
    width:95%;
    margin:30px auto;

    column-count:4;
    column-gap:20px;
}

.card{
    break-inside:avoid;
    margin-bottom:20px;
    overflow:hidden;
    border-radius:18px;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
    transition:.3s;
}

.card img{
    width:100%;
    display:block;
    border-radius:18px;
    transition:.4s;
}

.card:hover{
    transform:translateY(-6px);
}

.card:hover img{
    transform:scale(1.05);
}

@media(max-width:1200px){
    .gallery{
        column-count:3;
    }
}

@media(max-width:768px){
    .gallery{
        column-count:2;
    }
}

@media(max-width:500px){
    .gallery{
        column-count:1;
    }
}

    </style>
</head>
<body>

    <!-- Navbar -->
   <header>
    <div class="logo">
        <img src="{% static 'IMG/logo.jpg' %}" alt="Logo">
        <span>PHOTO GALLERY</span>
    </div>

    <nav>
        <a href="">Photos</a>
        <a href="#">Videos</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'showform' %}">Login</a>
    </nav>
</header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="search-box">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>
    </section>

    <!-- Gallery -->
    <section class="gallery-section">
        <h2> INDIAN FESTIVALS</h2>

        <div class="gallery">

           <div class="card">
    <a href="{% url 'navratri' %}" target="_blank">
        <img src="{% static 'IMG/durgaji.jpg' %}" alt="images/static/IMG/morning.jpg">
    </a>
    
    
        </div>

            <div class="card">
                    <a href="{% url 'ganesh' %}" target="_blank">
                <img src="{% static 'IMG/ganesh.jpg' %}" alt="images/static/IMG/morning.jpg">
                </a>
               
            </div>

            <div class="card">
                <a href="{% url 'krishna' %}" target="_blank">
                    <img src="{% static 'IMG/krishna.jpg' %}" alt="images/static/IMG/morning.jpg">
                    
                </a>
            </div>

            <div class="card">
                <a href="{% url 'christmas' %}" target="_blank">
                    <img src="{% static 'IMG/christmas.jpg' %}" alt="images/static/IMG/morning.jpg">
                   
                </a>
            </div>
            <div class="card">
                <a href="{% url 'christmas' %}" target="_blank">
                    <img src="{% static 'IMG/logos.jpg' %}" alt="images/static/IMG/morning.jpg">
                   
                </a>
            </div>

            

          
    
    </section>

</body>
</html>

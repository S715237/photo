{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Holi Gallery</title>
    <style>
        body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff0080, #ff8c00, #40e0d0);
    min-height:100vh;
}

.title{
    text-align:center;
    color:white;
    padding:20px;
    font-size:35px;
    text-shadow:2px 2px 5px black;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    width:280px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h2{
    color:#333;
    padding:15px;
}
    </style>
    
</head>
<body>

    <h1 class="title">🌈 Happy Holi Gallery 🌈</h1>

    <div class="container">

        <div class="card">
            <a href="https://images.unsplash.com/photo-1527529482837-4698179dc6ce" target="_blank">
                <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce" alt="Holi Colors">
            </a>
            <h2>Holi Colors</h2>
        </div>

        <div class="card">
            <a href="https://images.unsplash.com/photo-1617040619263-41c5a9ca7521" target="_blank">
                <img src="https://images.unsplash.com/photo-1617040619263-41c5a9ca7521" alt="Color Festival">
            </a>
            <h2>Color Festival</h2>
        </div>

        <div class="card">
            <a href="https://images.unsplash.com/photo-1584448141569-69f342da535c" target="_blank">
                <img src="https://images.unsplash.com/photo-1584448141569-69f342da535c" alt="Happy Holi">
            </a>
            <h2>Happy Holi</h2>
        </div>

        <div class="card">
            <a href="https://images.unsplash.com/photo-1558301211-0d8c8ddee6ec" target="_blank">
                <img src="https://images.unsplash.com/photo-1558301211-0d8c8ddee6ec" alt="Festival Fun">
            </a>
            <h2>Festival Fun</h2>
        </div>

    </div>

</body>
</html>
